<div class="simulator-container">
  <div class="ticket-icon">
<img src="../../../assets/images/" alt="Ticket Icon" />
  </div>
  <div class="form-container">
    <h2>Enter data to start the simulator</h2>
    <form>
      <label for="exit-doors">Num of exit doors:</label>
      <input type="number" id="exit-doors" placeholder="(2-9 sec)" min="2" max="9" />

      <label for="entry-doors">Num of entry doors:</label>
      <input type="number" id="entry-doors" placeholder="(2-9 sec)" min="2" max="9" />

      <label for="cash-registers">Num of cash registers:</label>
      <input type="number" id="cash-registers" placeholder="(1-11 sec)" min="1" max="11" />

      <label>Service time per customer:</label>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="static-time" /> Static time per customer:
        </label>
        <label>
          <input type="checkbox" id="random-time" checked /> Random time per customer:
        </label>
      </div>
      <input type="text" id="time-range" placeholder="(Enter range 2-10 sec)" />

      <button type="button" class="start-button">Start</button>
    </form>
  </div>
</div>
